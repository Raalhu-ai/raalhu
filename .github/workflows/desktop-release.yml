name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      RAALHU_RELEASE_BUILD: '1'
      RAALHU_RELEASE_API_BASE: ${{ vars.DESKTOP_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release configuration
        shell: bash
        run: |
          bun -e '
            const pkg = await Bun.file("apps/desktop/package.json").json();
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `desktop-v${pkg.version}`) throw new Error("Tag must match desktop package version");
            const url = new URL(process.env.RAALHU_RELEASE_API_BASE || "");
            if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || url.pathname !== "/" || ["localhost", "127.0.0.1", "[::1]"].includes(url.hostname)) throw new Error("Set DESKTOP_API_BASE to your public HTTPS backend origin");
          '
      - run: bun install --frozen-lockfile
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libarchive-tools rpm
      - name: Type check
        run: bun --filter @raalhu/desktop typecheck
      - name: Test backend configuration and BYOK
        run: bun test apps/desktop/test/api-base.test.ts apps/desktop/test/byok.test.ts
      - name: Build
        run: bun --filter @raalhu/desktop build
      - name: Test native SQLite under Electron
        run: bun --filter @raalhu/desktop test:storage
      - name: Package installers
        working-directory: apps/desktop
        run: bun run electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          # Optional: unsigned community builds work without signing credentials.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/release/Raalhu-*.exe
            apps/desktop/release/Raalhu-*.dmg
            apps/desktop/release/Raalhu-*.zip
            apps/desktop/release/Raalhu-*.AppImage
            apps/desktop/release/Raalhu-*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Generate checksums
        working-directory: installers
        run: sha256sum Raalhu-* > SHA256SUMS.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json; then
            test "$(jq -r .isDraft /tmp/release.json)" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Raalhu Desktop ${RELEASE_TAG#desktop-v}" --notes-file apps/desktop/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
